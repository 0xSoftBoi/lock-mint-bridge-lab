[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

# The invariant suite runs 512 sequences of depth 100 against the handler — the same
# budget the writeup cites. fail_on_revert = false because the handler intentionally
# attempts reverting (adversarial) calls.
[invariant]
runs = 512
depth = 100
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
